          left:  {title: "Ders", text: "Mesele soyut öğrenilir. Şartlar ve istisnalarla."}
          right: {title: "Fetva", text: "Somut durum vardır. Kişi, zaman, şartlar."}
          vo: "Derste mesele soyut olarak öğrenilir. Fetvada ise somut bir durum vardır: kişi, zaman, şartlar."
        - type: point
          kicker: "FARK NEREDE"
          tr: "Aynı hüküm, farklı sonuç verebilir."
          body: "Şartı değişen meselenin cevabı da değişir."
          vo: "Aynı hüküm iki farklı durumda farklı sonuç verebilir. Şartı değişen meselenin cevabı da değişir. Bu yüzden fetva, meseleyi bilen kadar durumu da bilmeyi gerektirir."
        - type: point
          kicker: "TALEBENİN İŞİ"
