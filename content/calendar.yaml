# Şifa Yayınevi — 30 günlük içerik takvimi
#
# Her gün: post (video | carousel) + story (video).
# Sahne tipleri: hook, concept, point, list, compare, quote, stat, book, cta
# Alanlar: kicker, tr, ar, translit, body, items, left/right, big, label, src, book, dur
# vo: seslendirme metni. Sahne süresi bu seslendirmenin gerçek uzunluğundan hesaplanır.
#     Arapça terimleri vo içinde Türkçe okunuşuyla yaz — TTS doğru telaffuz etsin.
# theme: boş bırakılırsa gün bazlı rotasyondan düşer (ardışık gün aynı temayı almaz).
# Kitap önerisi 30 günün 9'unda var (1, 4, 8, 12, 16, 19, 22, 27, 30) — akış kitapla boğulmasın.
#
# Hedef süre: post videosu 35-55 sn, story 8-20 sn. Dışına çıkarsa build uyarır.

days:

  # ═══════════════════════════════ 1 ═══════════════════════════════
  - day: 1
    title: "Sarf ilminin önemi + Mecmûatü's-Sarf"
    post:
      tags: ["#sarf", "#sarfilmi", "#mecmuatüssarf"]
      kind: video
      theme: kufi
      caption: |
        Bir kelimeyi sözlükte bulabiliyorsun. Ama aynı kelime cümlenin içinde
        karşına çıkınca tanıyamıyorsun. Aradaki fark: sarf.

        Sarf, kelimenin iç yapısını — kökünü, kalıbını, çekimini — çözen ilimdir.
        Nahiv cümleyi kurar; sarf o cümleyi kuran kelimeleri tanıtır.
        Bu yüzden klasik medrese usulünde yol daima sarftan başlar.

        Mecmûatü's-Sarf, bu yolun temel metinlerini tek ciltte topluyor:
        eski nüshaya sadık yeni dizgi, ayrı ayrı düzenlenmiş haşiyeler,
        karışabilecek yerlerde hareke.
      book_line: "Mecmûatü's-Sarf"
      scenes:
        - type: hook
          kicker: "ARAPÇA"
          tr: "Kelimeyi biliyorsun.<br>Cümlede neden tanıyamıyorsun?"
          vo: "Kelimeyi sözlükte buluyorsun. Ama cümlede karşına çıkınca tanıyamıyorsun."
        - type: concept
          kicker: "SARF İLMİ"
          ar: "اَلصَّرْف"
          translit: "es-Sarf"
          tr: "Kelimenin iç yapısını çözen ilim."
          vo: "اَلصَّرْفُ. Kelimenin kendi içindeki değişimini inceleyen ilim. Kökü, kalıbı, çekimi."
        - type: point
          kicker: "KÖK"
          tr: "Üç harf, onlarca kelime."
          ar: "كَاتِبٌ · مَكْتُوبٌ · كِتَابٌ · مَكْتَبٌ"
          body: "kâtib · mektûb · kitâb · mekteb — hepsi كَتَبَ kökünden"
          vo: "Üç harflik tek kök: كَتَبَ. Ondan: كَاتِبٌ، مَكْتُوبٌ، كِتَابٌ، مَكْتَبٌ."
        - type: compare
          kicker: "İKİ İLİM"
          tr: "Sarf ile nahiv aynı şey değil."
          left:  {ar: "اَلصَّرْف", title: "Sarf", text: "Kelimenin içini çözer. Kök, kalıp, çekim."}
          right: {ar: "اَلنَّحْو", title: "Nahiv", text: "Kelimenin cümledeki yerini ve son harekesini belirler."}
          vo: "اَلصَّرْفُ kelimenin içini çözer. اَلنَّحْوُ cümledeki yerini belirler."
        - type: point
          kicker: "NEDEN ÖNCE SARF"
          tr: "Kökü bulamazsan sözlük de işe yaramaz."
          body: "Arapça sözlükler kelimeleri kökten dizer."
          vo: "Arapça sözlükler kökten dizilir. Kökü çıkaramayan, bildiği kelimeyi bile arayamaz."
        - type: book
          kicker: "ŞİFA YAYINEVİ"
          book: mecmuatus-sarf
          vo: "Klasik usulde sarf bir mecmua üzerinden okunur. مَجْمُوعَةُ الصَّرْف bu metinleri tek ciltte toplar."
        - type: list
          kicker: "BU BASKIDA"
          tr: "Eski nüshaya sadık, yeni dizgi"
          items:
            - "Bütün metin yeniden dizildi, sayfa tutarları korundu"
            - "Ana metin, yan haşiye ve ara haşiye ayrı düzenlendi"
            - "Karışabilecek yerlere hareke konuldu"
          vo: "Metin yeniden dizildi. Haşiyeler ayrı ayrı düzenlendi. Karışabilecek yerler harekelendi."
        - type: cta
          tr: "Önce sarf."
          body: "Ezberden anlamaya geçmenin ilk adımı."
          vo: "Sarfa başlamak, Arapçayı ezberden anlamaya geçirmektir."
    story:
      kind: video
      theme: nur
      caption: "Sarf nedir?"
      scenes:
        - type: hook
          kicker: "BUGÜN"
          tr: "Sarf ne demek?"
          vo: "Sarf ne demek?"
        - type: concept
          ar: "اَلصَّرْف"
          translit: "es-Sarf"
          tr: "Kelimenin iç yapısı."
          body: "Kök · kalıp · çekim"
          vo: "اَلصَّرْفُ. Kelimenin kendi içindeki değişimini inceleyen ilim."
        - type: cta
          tr: "Ayrıntısı profilde"
          body: "Mecmûatü's-Sarf"
          vo: "Bugünkü gönderide ayrıntısı var."

  # ═══════════════════════════════ 2 ═══════════════════════════════
  - day: 2
    title: "el-Emsile nedir?"
    post:
      tags: ["#emsile", "#sarf", "#arapçaöğren"]
      kind: carousel
      theme: samua
      caption: |
        Sarfa başlayan herkesin ilk karşılaştığı metin: el-Emsile.

        Emsile "örnekler" demek. Tek bir fiilin — نَصَرَ — otuz beş ayrı çekimini
        sırayla önüne koyar. Kural anlatmaz, örnek gösterir.
        Klasik usulün mantığı budur: önce kalıbı göz tanır, kural sonra gelir.

        Emsile'de maksat ezber değil, ritim. Sesli okunur, sıra bozulmaz,
        her gün az ama kesintisiz.
      scenes:
        - type: hook
          kicker: "SARFIN İLK ADIMI"
          tr: "el-Emsile"
          ar: "اَلْأَمْثِلَة"
          body: "Kural anlatmayan, örnek gösteren metin."
          dur: 3.0
        - type: concept
          kicker: "ANLAMI"
          ar: "أَمْثِلَة"
          translit: "emsile"
          tr: "“Örnekler” demek."
          body: "Misâl kelimesinin çoğulu."
          dur: 3.0
        - type: point
          kicker: "TEK FİİL ÜZERİNDEN"
          ar: "نَصَرَ"
          tr: "Bütün çekimler bir fiille gösterilir."
          body: "“Yardım etti” — sarf kitaplarının örnek fiili."
          dur: 3.0
        - type: stat
          kicker: "EMSİLE-İ MUHTELİFE"
          big: "35"
          label: "ayrı çekim"
          body: "Mâzî, muzârî, emir, nehiy, ism-i fâil, ism-i mef'ûl… sırayla."
          dur: 3.2
        - type: list
          kicker: "NASIL OKUNUR"
          tr: "Üç usul"
          items:
            - "Sesli oku — kalıp kulakta oturur"
            - "Sırayı bozma, atlama yapma"
            - "Her gün az ama kesintisiz"
          dur: 3.6
        - type: cta
          tr: "Emsile biterse sıra Binâ'da."
          body: "Yarın: Binâ nedir?"
          dur: 3.0
    story:
      kind: video
      theme: editorial
      caption: "Emsile ne demek?"
      scenes:
        - type: concept
          kicker: "KELİME"
          ar: "أَمْثِلَة"
          translit: "emsile"
          tr: "“Örnekler”"
          vo: "اَلْأَمْثِلَة, örnekler demek. مِثَال kelimesinin çoğulu."
        - type: point
          kicker: "NEDEN ÖNEMLİ"
          tr: "Kuraldan önce göz alışkanlığı."
          vo: "Klasik usulde önce kalıbı göz tanır. Kural sonra gelir."
        - type: cta
          tr: "Bugünkü gönderide"
          body: "Emsile'nin okunuş usulü"
          vo: "Ayrıntısı bugünkü gönderide."

  # ═══════════════════════════════ 3 ═══════════════════════════════
  - day: 3
    title: "el-Binâ: 35 bâb"
    post:
      tags: ["#bina", "#sarf", "#arapçagramer"]
      kind: video
      caption: |
        Emsile tek fiilin çekimlerini gösterir. Binâ ise fiillerin kaç farklı
        kalıpta kurulduğunu öğretir.

        Otuz beş bâb. Her bâb, fiilin harf sayısına ve eklenen harflere göre
        ayrı bir kalıp demek. Kalıbı tanıyan talebe, hiç görmediği bir fiilin
        bile anlamını tahmin edebilir — çünkü kalıbın kendisi anlam taşır.

        Sarfta ezberlenen şey kelimeler değil, kalıplardır.
      scenes:
        - type: hook
          kicker: "SARF · 2. ADIM"
          tr: "Hiç görmediğin bir fiili nasıl anlarsın?"
          vo: "Hiç görmediğin bir fiilin anlamını nasıl tahmin edersin? Cevap, kelimenin kalıbında saklı."
        - type: concept
          kicker: "EL-BİNÂ"
          ar: "اَلْبِنَاء"
          translit: "el-Binâ"
          tr: "Fiilin kuruluş kalıpları."
          vo: "اَلْبِنَاء. Fiilin hangi kalıpta kurulduğunu öğreten metin."
        - type: stat
          kicker: "KALIP SAYISI"
          big: "35"
          label: "bâb"
          body: "Harf sayısına ve eklenen harflere göre."
          vo: "Otuz beş bâb. Her bâb ayrı bir kalıp demek."
        - type: compare
          kicker: "KALIP ANLAM TAŞIR"
          tr: "Aynı kök, farklı kalıp"
          left:  {ar: "عَلِمَ", title: "alime", text: "bildi"}
          right: {ar: "عَلَّمَ", title: "alleme", text: "öğretti"}
          vo: "عَلِمَ bildi demek. Şedde gelince عَلَّمَ olur: öğretti."
        - type: point
          kicker: "SONUÇ"
          tr: "Kalıbı tanıyan, kelimeyi tanır."
          body: "Sözlüğe bakmadan önce kalıba bak."
          vo: "Kalıbı tanıyan talebe, sözlüğe bakmadan önce anlamı sezer. Çünkü aynı kalıp, hangi köke gelirse gelsin benzer bir anlam katar."
        - type: list
          kicker: "ÇALIŞMA USULÜ"
          tr: "Binâ nasıl çalışılır?"
          items:
            - "Her bâbı kendi örnek fiiliyle ezberle"
            - "Bâbın kattığı anlamı not et"
            - "Okuduğun metinde o bâbı ara"
          vo: "Her bâbı kendi örneğiyle ezberle. Kattığı anlamı not et. Sonra metinde ara. Üç haftada otuz beş bâb, günde iki bâb demektir."
        - type: cta
          tr: "Kelime değil, kalıp."
          body: "Sarfın bütün sırrı burada."
          vo: "Sarfta ezberlenen şey kelimeler değil, kalıplardır."
    story:
      kind: video
      caption: "Binâ'nın 35 bâbı"
      scenes:
        - type: stat
          kicker: "EL-BİNÂ"
          big: "35"
          label: "bâb"
          vo: "اَلْبِنَاء. Otuz beş bâb vardır."
        - type: compare
          tr: "Kalıp anlamı değiştirir"
          left:  {ar: "عَلِمَ", title: "alime", text: "bildi"}
          right: {ar: "عَلَّمَ", title: "alleme", text: "öğretti"}
          vo: "عَلِمَ bildi, عَلَّمَ öğretti. Aynı kök, farklı kalıp."
        - type: cta
          tr: "Gönderide detaylı"
          vo: "Ayrıntısı bugünkü gönderide."

  # ═══════════════════════════════ 4 ═══════════════════════════════
  - day: 4
    title: "Nahiv nedir? + Mecmûatü'n-Nahiv"
    post:
      tags: ["#nahiv", "#nahivilmi", "#arapçakitap"]
      kind: video
      caption: |
        Sarf kelimeyi tanıtır, nahiv cümleyi kurar.

        Nahiv, kelimelerin cümle içindeki görevini ve bu göreve bağlı olarak
        son harekesinin nasıl değiştiğini inceler. Fâil ref' olur, mef'ûl nasb
        olur — ve tek bir hareke, cümlenin anlamını tersine çevirebilir.

        Sarfı bitiren talebenin yolu buradan geçer.
      book_line: "Mecmûatü'n-Nahiv"
      scenes:
        - type: hook
          kicker: "TEK HAREKE"
          tr: "Bir hareke, cümlenin anlamını tersine çevirebilir."
          vo: "Tek bir hareke, cümlenin anlamını tersine çevirebilir. Üstelik harflerin hiçbirine dokunmadan."
        - type: concept
          kicker: "NAHİV"
          ar: "اَلنَّحْو"
          translit: "en-Nahv"
          tr: "Kelimenin cümledeki görevi."
          vo: "اَلنَّحْوُ. Kelimenin cümledeki görevini ve son harekesini inceler."
        - type: compare
          kicker: "ÖRNEK"
          tr: "Aynı kelimeler, farklı hareke"
          left:  {ar: "ضَرَبَ زَيْدٌ عَمْرًا", title: "Zeyd dövdü", text: "Zeyd fâil, Amr mef'ûl."}
          right: {ar: "ضَرَبَ زَيْدًا عَمْرٌو", title: "Amr dövdü", text: "Hareke değişti, fâil değişti."}
          vo: "ضَرَبَ زَيْدٌ عَمْرًا. ضَرَبَ زَيْدًا عَمْرٌو. Hareke değişti, döven ile dövülen yer değiştirdi."
        - type: point
          kicker: "İ'RÂB"
          ar: "اَلْإِعْرَاب"
          tr: "Son harekenin göreve göre değişmesi."
          vo: "Buna اَلْإِعْرَاب denir. Son harekenin göreve göre değişmesi. Arapçayı Türkçeden ayıran en temel özellik budur."
        - type: book
          kicker: "ŞİFA YAYINEVİ"
          book: mecmuatun-nahiv
          vo: "Nahvin temel metinleri de bir mecmuada toplanır: مَجْمُوعَةُ النَّحْو."
        - type: cta
          tr: "Sarf kelimeyi, nahiv cümleyi verir."
          body: "İkisi birlikte Arapçayı verir."
          vo: "Sarf kelimeyi verir, nahiv cümleyi. İkisi birlikte Arapçayı. Birini yarım bırakan, diğerinde ilerleyemez."
    story:
      kind: video
      caption: "Nahiv nedir?"
      scenes:
        - type: concept
          ar: "اَلنَّحْو"
          translit: "en-Nahv"
          tr: "Kelimenin cümledeki görevi."
          vo: "اَلنَّحْوُ. Kelimenin cümledeki görevini inceler."
        - type: point
          kicker: "NEDEN"
          tr: "Tek hareke anlamı çevirir."
          vo: "Çünkü tek bir hareke anlamı tersine çevirebilir."
        - type: cta
          tr: "Gönderide örnekle"
          vo: "Örneğiyle bugünkü gönderide."

  # ═══════════════════════════════ 5 ═══════════════════════════════
  - day: 5
    title: "Arapçada kök mantığı"
    post:
      tags: ["#sarf", "#arapçaöğren", "#arapçagramer"]
      kind: carousel
      caption: |
        Arapça kelime ezberlemek, aslında kök ezberlemektir.

        Çoğu kelime üç harflik bir kökten türer. Kök anlamı taşır, kalıp o anlamı
        biçimlendirir. ك ت ب kökü "yazmak" demektir; kâtib yazan, mektûb yazılan,
        mekteb yazılan yer, kitâb yazılmış şeydir.

        Bir kök öğrenmek, on kelime öğrenmektir.
      scenes:
        - type: hook
          kicker: "KELİME EZBERİ"
          tr: "On kelime mi,<br>bir kök mü?"
          dur: 3.0
        - type: concept
          kicker: "KÖK"
          ar: "ك ت ب"
          translit: "k-t-b"
          tr: "Anlamı taşıyan üç harf."
          body: "“Yazmak”"
          dur: 3.2
        - type: list
          kicker: "AYNI KÖKTEN"
          tr: "Tek kök, beş kelime"
          items:
            - "كَاتِب — kâtib · yazan"
            - "مَكْتُوب — mektûb · yazılan"
            - "مَكْتَب — mekteb · yazılan yer"
            - "كِتَاب — kitâb · yazılmış olan"
            - "كِتَابَة — kitâbet · yazma işi"
          dur: 4.2
        - type: point
          kicker: "MANTIK"
          tr: "Kök anlamı taşır, kalıp biçimlendirir."
          dur: 3.0
        - type: point
          kicker: "SÖZLÜK"
          tr: "Arapça sözlükler alfabetik değil, köktendir."
          body: "Kökü bulamayan, kelimeyi arayamaz."
          dur: 3.2
        - type: cta
          tr: "Kelime değil, kök topla."
          dur: 3.0
    story:
      kind: video
      caption: "Bir kök, beş kelime"
      scenes:
        - type: concept
          kicker: "KÖK"
          ar: "ك ت ب"
          tr: "“Yazmak”"
          vo: "كَتَبَ. Yazmak demek."
        - type: point
          ar: "كَاتِبٌ · مَكْتُوبٌ · مَكْتَبٌ · كِتَابٌ"
          tr: "Hepsi aynı kökten."
          body: "kâtib · mektûb · mekteb · kitâb"
          vo: "كَاتِبٌ، مَكْتُوبٌ، مَكْتَبٌ، كِتَابٌ. Hepsi bu kökten."
        - type: cta
          tr: "Bir kök, on kelime."
          vo: "Bir kök öğrenmek, on kelime öğrenmektir."

  # ═══════════════════════════════ 6 ═══════════════════════════════
  - day: 6
    title: "Hareke anlamı nasıl değiştirir?"
    post:
      tags: ["#hareke", "#arapçaöğren", "#arapçagramer"]
      kind: video
      caption: |
        Arapçada harfler aynı kalır, hareke değişir — ve anlam başkalaşır.

        كَتَبَ yazdı, كُتِبَ yazıldı. Harfler tıpatıp aynı; fark sadece harekede.
        Meçhul kalıbı işte böyle kurulur.

        Harekesiz metin okuyabilmek, kalıpları tanımakla mümkündür. Bu yüzden
        klasik metinlerde karışabilecek yerlere hareke konulur, tamamına değil.
      scenes:
        - type: hook
          kicker: "HAREKE"
          tr: "Aynı harfler.<br>Başka anlam."
          vo: "Harfler aynı. Hareke değişti. Anlam başkalaştı. Arapçada bu, istisna değil kaidedir."
        - type: compare
          kicker: "MEÇHUL"
          tr: "Tek fark: hareke"
          left:  {ar: "كَتَبَ", title: "ketebe", text: "yazdı — fâili belli"}
          right: {ar: "كُتِبَ", title: "kütibe", text: "yazıldı — fâili söylenmemiş"}
          vo: "كَتَبَ yazdı demek. كُتِبَ ise yazıldı. Harfler aynı, hareke farklı."
        - type: concept
          kicker: "TERİM"
          ar: "اَلْمَجْهُول"
          translit: "el-Mechûl"
          tr: "Fâili söylenmeyen fiil."
          vo: "Buna اَلْمَجْهُول denir. Fâili söylenmeyen fiil."
        - type: point
          kicker: "ASIL MESELE"
          tr: "Harekesiz metni kalıp okutur."
          body: "Gözün kalıbı tanıması, harekenin yerini tutar."
          vo: "Harekesiz metni okutan şey kalıptır. Göz kalıbı tanırsa hareke gerekmez. Bu yüzden klasik metinler çoğunlukla harekesiz basılır."
        - type: point
          kicker: "KLASİK USUL"
          tr: "Tamamına değil, karışana hareke."
          body: "Metnin her yerini harekelemek talebeyi tembelleştirir."
          vo: "Bu yüzden klasik baskılarda yalnız karışabilecek yerler harekelenir. Her kelimeyi harekelemek, talebenin kalıp tanıma kasını zayıflatır."
        - type: cta
          tr: "Hareke bir koltuk değneğidir."
          body: "Maksat, onsuz yürüyebilmek."
          vo: "Hareke bir koltuk değneğidir. Maksat onsuz yürüyebilmek."
    story:
      kind: video
      caption: "ketebe / kütibe"
      scenes:
        - type: compare
          kicker: "TEK FARK"
          tr: "Hareke"
          left:  {ar: "كَتَبَ", title: "ketebe", text: "yazdı"}
          right: {ar: "كُتِبَ", title: "kütibe", text: "yazıldı"}
          vo: "كَتَبَ yazdı, كُتِبَ yazıldı."
        - type: point
          tr: "Harfler aynı, anlam başka."
          vo: "Harfler tıpatıp aynı. Değişen sadece hareke."
        - type: cta
          tr: "Gönderide ayrıntısı"
          vo: "Ayrıntısı bugünkü gönderide."

  # ═══════════════════════════════ 7 ═══════════════════════════════
  - day: 7
