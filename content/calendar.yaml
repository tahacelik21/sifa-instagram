        Arapçada ikisi için tek kalıp vardır: أَفْعَل.

        Bu kalıba ism-i tafdîl denir. أَكْبَر hem "daha büyük" hem
        "en büyük" demektir; hangisi olduğunu cümledeki yapı belirler.

        مِنْ ile gelirse karşılaştırma, ال ile gelirse üstünlük olur.
        Tek harf, iki ayrı mana.
