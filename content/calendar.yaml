          left:  {ar: "ظَرْفُ زَمَان", title: "Zaman", text: "يَوْمَ · لَيْلًا · صَبَاحًا"}
          right: {ar: "ظَرْفُ مَكَان", title: "Mekân", text: "أَمَامَ · تَحْتَ · عِنْدَ"}
          vo: "ظَرْفُ زَمَان zamanı bildirir: يَوْمَ، لَيْلًا. ظَرْفُ مَكَان yeri bildirir: أَمَامَ، تَحْتَ، عِنْدَ."
        - type: point
