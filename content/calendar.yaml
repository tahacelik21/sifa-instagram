  # ═══════════════════════════════ 8 ═══════════════════════════════
  - day: 8
    title: "el-Maksûd + Şürûhu'l-Maksûd"
    post:
      tags: ["#maksud", "#sarf", "#klasikmetin"]
      kind: video
      caption: |
        Emsile örnek verir, Binâ kalıbı gösterir. el-Maksûd ise kuralı söyler.

        Sarf yolculuğunda üçüncü durak. Artık çekim tabloları değil, o tabloların
        arkasındaki kaideler konuşulur: i'lâl, idgâm, hemze meselesi.

        Maksûd'u şerhsiz okumak zordur; bu yüzden klasik usulde metin, şerhleriyle
        birlikte okutulur.
      book_line: "Şürûhu'l-Maksûd"
      scenes:
        - type: hook
          kicker: "SARF · 3. ADIM"
          tr: "Tabloyu ezberledin.<br>Peki neden böyle?"
          vo: "Çekim tablosunu ezberledin. Peki neden böyle olduğunu biliyor musun? Emsile ve Binâ sana ne olduğunu gösterdi; niçin olduğunu değil."
        - type: concept
          kicker: "EL-MAKSÛD"
          ar: "اَلْمَقْصُود"
          translit: "el-Maksûd"
          tr: "Kalıbın arkasındaki kaide."
          vo: "اَلْمَقْصُود. Kalıbın arkasındaki kaideyi anlatan metin. Artık ezberlediğin tablonun sebebini öğrenirsin."
        - type: list
          kicker: "KONULARI"
          tr: "Artık kural konuşulur"
          items:
            - "İ'lâl — illetli harflerin değişmesi"
            - "İdgâm — iki harfin birleşmesi"
            - "Hemze ve vakf meseleleri"
          vo: "اَلْإِعْلَال، اَلْإِدْغَام ve hemze meseleleri. Artık tablo değil, kural konuşulur. Bunlar, harfler birbirine komşu olunca neden değiştiğini anlatan bahislerdir."
        - type: point
          kicker: "NEDEN ŞERHLİ"
          tr: "Metin kısa, mesele derin."
          body: "Maksûd'un her satırı bir bahis açar."
          vo: "Metin kısadır ama her satırı bir bahis açar. Bu yüzden şerhsiz okunmaz. Bir satırın altında bazen üç sayfalık tartışma durur."
        - type: book
          kicker: "ŞİFA YAYINEVİ"
          book: suruhul-maksud
          vo: "شُرُوحُ الْمَقْصُود, metni şerhleriyle birlikte veriyor."
        - type: cta
          tr: "Kuralı bilen, kalıbı unutmaz."
          vo: "Kuralı bilen talebe, kalıbı unutmaz."
    story:
      kind: video
      caption: "Maksûd nedir?"
      scenes:
        - type: concept
          ar: "اَلْمَقْصُود"
          translit: "el-Maksûd"
          tr: "Kalıbın arkasındaki kaide."
          vo: "اَلْمَقْصُود. Kalıbın arkasındaki kaideyi anlatır."
        - type: point
          kicker: "SIRA"
          tr: "Emsile → Binâ → Maksûd"
          vo: "اَلْأَمْثِلَة، اَلْبِنَاء، اَلْمَقْصُود."
        - type: cta
