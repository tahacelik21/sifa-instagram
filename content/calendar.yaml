  # ═══════════════════════════════ 78 ══════════════════════════════
  - day: 78
    title: "Sayılar ve temyizi"
    post:
      tags: ["#nahiv", "#arapçagramer", "#arapçaders"]
      kind: video
      caption: |
        Arapçada sayı saymak, sayıyı söylemekle bitmez. Sayılan şeyin
        hangi hâlde geleceği de kaidelidir — üstelik sayıya göre değişir.

        Üçten ona kadar sayılan çoğul ve mecrûr gelir. On birden
        doksan dokuza kadar tekil ve mansûb. Yüz ve bin ile tekil ve mecrûr.

        Bir de sayının kendisinin müzekker-müennes uyumu var ve çoğu
        yerde tersinedir. Kaideyi bilmeyen için en şaşırtıcı bahislerden biri.
      scenes:
        - type: hook
          kicker: "NAHİV"
          tr: "Sayıyı söyledin.<br>Peki sayılan nasıl gelecek?"
          vo: "Sayıyı söylemek yetmiyor. Sayılan şeyin hangi hâlde geleceği de kaideli."
        - type: list
          kicker: "ÜÇ KAİDE"
          tr: "Sayıya göre değişir"
          items:
            - "3-10: çoğul ve mecrûr — ثَلَاثَةُ كُتُبٍ"
            - "11-99: tekil ve mansûb — عِشْرُونَ كِتَابًا"
            - "100 ve 1000: tekil ve mecrûr — مِائَةُ كِتَابٍ"
          vo: "Üçten ona kadar sayılan çoğul ve mecrûr gelir. On birden doksan dokuza tekil ve mansûb. Yüz ve binde tekil ve mecrûr."
        - type: point
          kicker: "ŞAŞIRTAN KISIM"
          tr: "Sayının cinsiyeti çoğu yerde tersinedir."
          body: "ثَلَاثَةُ كُتُبٍ — kitap müzekker, sayı müennes görünüyor."
          vo: "Sayının müzekker-müennes uyumu çoğu yerde tersinedir. ثَلَاثَةُ كُتُبٍ denir; sayı müennes görünür."
        - type: point
          kicker: "NİÇİN ÖNEMLİ"
          tr: "Metinde sayı çok geçer."
          body: "Âyet, hadis, fıkıh — hepsinde miktar vardır."
          vo: "Metinlerde sayı çok geçer. Âyette, hadiste, fıkıhta miktar vardır."
        - type: point
          kicker: "USUL"
          tr: "Üç kaideyi örnekle ezberle."
          body: "Kuru liste yerine üç cümle."
          vo: "Üç kaideyi kuru liste olarak değil, üç örnek cümleyle ezberle. Daha kalıcı olur."
        - type: cta
          tr: "Sayı kolay, temyizi kaideli."
          body: "Kaideyi bilen tereddüt etmez."
          vo: "Sayıyı söylemek kolay, temyizi kaidelidir. Kaideyi bilen tereddüt etmez."
    story:
      kind: video
      caption: "Sayıdan sonra ne gelir?"
      scenes:
        - type: hook
          kicker: "BUGÜN"
          tr: "Sayıdan sonra<br>hangi hâl gelir?"
          vo: "Sayıdan sonra gelen kelime hangi hâlde olur?"
        - type: point
          ar: "ثَلَاثَةُ كُتُبٍ"
          tr: "3-10 arası: çoğul ve mecrûr."
          vo: "ثَلَاثَةُ كُتُبٍ. Üçten ona kadar çoğul ve mecrûr."
        - type: cta
          tr: "Üç kaide gönderide"
          vo: "Üç kaidenin tamamı bugünkü gönderide."

