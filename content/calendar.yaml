          left:  {title: "Başkasının şerhi", text: "“Burada şunu kastetmiş olmalı.” Yorum."}
          right: {title: "Müellifin şerhi", text: "“Burada şunu kastettim.” Beyan."}
          vo: "Başkasının şerhi yorumdur: burada şunu kastetmiş olmalı. Müellifin şerhi beyandır: burada şunu kastettim."
