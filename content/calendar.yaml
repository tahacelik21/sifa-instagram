  - day: 66
    title: "Cemî çeşitleri: sâlim ve mükesser"
    post:
      tags: ["#sarf", "#arapçagramer", "#arapçaöğren"]
      kind: video
      caption: |
        Türkçede çoğul tek ektir: "-ler". Arapçada ise çoğul üç yoldan yapılır
        ve biri kelimenin şeklini tamamen bozar.

        Sâlim çoğulda kelime sağlam kalır, sonuna ek gelir. Mükesser çoğulda
        kelime kırılır — harfler yerinde durur ama düzen değişir.

        كِتَاب çoğul olunca كُتُب olur. Aynı kök, başka bir biçim.
        Bu yüzden sözlükte kök aranır, kelimenin kendisi değil.
      scenes:
        - type: hook
          kicker: "SARF"
          tr: "كِتَاب çoğul olunca<br>neden كُتُب oluyor?"
          vo: "كِتَاب çoğul olunca neden كُتُب oluyor? Ek gelmedi, kelime değişti."
        - type: compare
          kicker: "İKİ YOL"
          tr: "Çoğul iki şekilde yapılır."
          left:  {ar: "سَالِم", title: "Sâlim", text: "Kelime sağlam kalır, sonuna ek gelir. مُسْلِمُونَ"}
          right: {ar: "مُكَسَّر", title: "Mükesser", text: "Kelime kırılır, biçim değişir. كُتُب"}
          vo: "Sâlim çoğulda kelime sağlam kalır, sonuna ek gelir: مُسْلِمُونَ. Mükesser çoğulda kelime kırılır: كُتُب."
        - type: point
          kicker: "NEDEN ÖNEMLİ"
          tr: "Mükesser çoğul sözlükte ayrı görünür."
          body: "Kökü bilmeyen, çoğulu başka kelime sanır."
          vo: "Mükesser çoğul sözlükte bambaşka görünür. Kökü bilmeyen talebe onu ayrı bir kelime sanır."
        - type: point
          kicker: "ÇÖZÜM"
          tr: "Kökü çıkar, kalıbı tanı."
          body: "كُتُب ← ك ت ب · فُعُل vezninde"
          vo: "Çözüm kökü çıkarmak. كُتُب kelimesinin kökü kâf, tâ, bâ. Vezni فُعُل."
        - type: point
          kicker: "USUL"
          tr: "Çoğulu kelimeyle birlikte ezberle."
          body: "Sözlükte zaten yan yana yazar."
          vo: "Kelimeyi öğrenirken çoğulunu da birlikte ezberle. Sözlükte zaten yan yana yazar."
        - type: cta
          tr: "Kırılan kelime, duran kök."
          body: "Biçim değişir, kök durur."
          vo: "Biçim değişir ama kök durur. Kökü tutan, kelimeyi kaybetmez."
