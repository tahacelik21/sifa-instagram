  # ═══════════════════════════════ 76 ══════════════════════════════
  - day: 76
    title: "Zarflar ve terkipler + Zurûf ve Terkîb"
    post:
      tags: ["#nahiv", "#arapçagramer", "#arapçakitap"]
      kind: video
      book_line: "Zurûf ve Terkîb"
      caption: |
        Cümlenin iskeleti fiil, fâil ve mef'ûldür. Ama konuşma bununla
        bitmez: ne zaman, nerede, ne kadar süreyle?

        Bu soruların cevabı zarflarla verilir. Zarf-ı zaman ve zarf-ı
        mekân, mef'ûlün fîh başlığı altında incelenir ve mansûbdur.

        Zarflar kısa kelimelerdir ama cümleye yerleşmeleri kuralsız değildir.
        Terkip bilgisiyle birlikte öğrenilince yerli yerine oturur.
      scenes:
        - type: hook
          kicker: "NAHİV"
          tr: "Ne zaman? Nerede?"
          body: "Cümlenin iskeleti bunları söylemez."
          vo: "Fiil, fâil, mef'ûl. Peki ne zaman, nerede? Cümlenin iskeleti bunları söylemez."
        - type: concept
          kicker: "CEVAP"
          ar: "اَلظَّرْف"
          translit: "ez-zarf"
          tr: "Zaman ve yer bildiren mansûb isim."
          vo: "اَلظَّرْف. Fiilin ne zaman ve nerede olduğunu bildiren mansûb isim."
        - type: compare
