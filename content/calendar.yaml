  # ═══════════════════════════════ 11 ═══════════════════════════════
  - day: 11
    title: "Lâzım ve müteaddî fiil"
    post:
      tags: ["#nahiv", "#arapçagramer", "#arapçaöğren"]
      kind: video
      caption: |
        Bazı fiiller nesne ister, bazıları istemez.

        ذَهَبَ "gitti" — nesnesi yoktur, lâzımdır.
        قَرَأَ "okudu" — neyi okudu? Nesne ister, müteaddîdir.

        Bu ayrımı bilmeyen talebe, cümlede mef'ûl ararken olmayanı arar ya da
        olanı göremez. Sarf ile nahvin birbirine en çok değdiği yer burasıdır.
      scenes:
        - type: hook
          kicker: "FİİL"
          tr: "Her fiil nesne istemez. Bunu bilmeyen, cümlede olmayan bir şeyi arar."
          vo: "Her fiil nesne istemez."
        - type: compare
          kicker: "İKİ TÜR"
          tr: "Lâzım ve müteaddî"
          left:  {ar: "ذَهَبَ", title: "Lâzım", text: "“gitti” — nesne almaz"}
          right: {ar: "قَرَأَ", title: "Müteaddî", text: "“okudu” — nesne ister"}
          vo: "ذَهَبَ gitti demek, nesne almaz. قَرَأَ okudu demek, nesne ister."
        - type: concept
          kicker: "TERİM"
          ar: "اَلْمُتَعَدِّي"
          translit: "el-Müteaddî"
          tr: "Fâilden nesneye “geçen” fiil."
          vo: "اَلْمُتَعَدِّي, geçen demektir. Fiilin tesiri fâilden nesneye geçer. Tesir fâilde kalıyorsa lâzım, dışarı taşıyorsa müteaddîdir."
        - type: point
          kicker: "NEDEN ÖNEMLİ"
          tr: "Olmayan mef'ûlü arama."
          body: "Lâzım fiilde mef'ûl aramak, cümleyi yanlış kurdurur."
          vo: "Lâzım fiilde mef'ûl aramak, cümleyi baştan yanlış kurdurur."
        - type: point
          kicker: "İPUCU"
          tr: "Kalıp, fiili geçişli yapabilir."
          ar: "عَلِمَ ← عَلَّمَ"
          body: "Şedde geldi, fiil nesne ister oldu."
          vo: "Kalıp da fiili geçişli yapar: عَلِمَ bildi, عَلَّمَ öğretti."
        - type: cta
          tr: "Önce fiili tanı."
          body: "Cümle ondan sonra kurulur."
          vo: "Önce fiili tanı. Cümle ondan sonra kurulur. Çünkü Arapça cümlenin iskeleti fiildir."
    story:
      kind: video
      caption: "Lâzım / müteaddî"
      scenes:
        - type: compare
          tr: "Nesne ister mi?"
          left:  {ar: "ذَهَبَ", title: "Lâzım", text: "istemez"}
          right: {ar: "قَرَأَ", title: "Müteaddî", text: "ister"}
          vo: "ذَهَبَ nesne almaz. قَرَأَ nesne ister."
        - type: point
          tr: "Olmayan mef'ûlü arama."
          vo: "Lâzım fiilde mef'ûl aramak cümleyi yanlış kurdurur."
        - type: cta
