          vo: "Ayrıntısı bugünkü gönderide."

  # ═══════════════════════════════ 9 ═══════════════════════════════
  - day: 9
    title: "et-Tasrîfu'l-İzzî"
    post:
      tags: ["#sarfilmi", "#klasikmetin", "#talebe"]
      kind: video
      caption: |
        Sarfın klasik dizisinde dördüncü metin: İzzî.

        İzzeddîn ez-Zencânî'nin kaleme aldığı bu kısa risâle, sarfın bütün
        bahislerini derli toplu bir araya getirir. Kısadır ama yoğundur;
        asırlardır medreselerde okutulmasının sebebi budur.

        Sarf yolu burada tamamlanır, nahiv kapısı açılır.
      scenes:
        - type: hook
          kicker: "SARF · 4. ADIM"
          tr: "Kısa bir risâle.<br>Asırlardır okutuluyor."
          vo: "Çok kısa bir risâle. Ama asırlardır medreselerde okutuluyor. Kısalığı zayıflığından değil, yoğunluğundandır."
        - type: concept
          kicker: "ET-TASRÎFU'L-İZZÎ"
          ar: "اَلتَّصْرِيفُ الْعِزِّي"
          translit: "et-Tasrîfu'l-İzzî"
          tr: "Sarfın derli toplu özeti."
          vo: "اَلتَّصْرِيفُ الْعِزِّي. Sarfın bütün bahislerini derli toplu verir."
        - type: point
          kicker: "MÜELLİFİ"
          tr: "İzzeddîn ez-Zencânî"
          body: "Risâle, müellifinin adıyla anılır oldu."
          vo: "Müellifi İzzeddîn ez-Zencânî. Risâle onun adıyla anılır."
        - type: point
          kicker: "NEDEN BU KADAR YAYGIN"
          tr: "Kısa, ama eksiksiz."
          body: "Ezberlenebilecek kadar kısa, yetecek kadar kapsamlı. Talebe onu ezberler, ömrü boyunca ona döner."
          vo: "Ezberlenebilecek kadar kısa, yetecek kadar kapsamlı."
        - type: point
