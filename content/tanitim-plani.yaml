    konu: "Telhîs'i şerhle okumak"
  - day: 94
    book: belagatul-vadiha
    konu: "Belâgat alıştırmayla öğrenilir mi?"
  - day: 97
    book: safahat-belagat
    konu: "Belâgate kısa yoldan giriş"
  - day: 100
    book: suruhul-alaka
    konu: "Alâka: mecâzın mantığı"
  - day: 103
    book: nurul-izah
    konu: "Fıkha ilk adım: ibadet bahisleri"
  - day: 106
    book: merakil-felah
    konu: "Metni şerhiyle okumak — fıkıhta da aynı usul"
  - day: 109
    book: halebi-sagir
    konu: "Namazın fıkhı niçin ayrı bir kitap?"
  - day: 112
