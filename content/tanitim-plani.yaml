# Şifa Yayınevi — 180 günlük ürün tanıtım planı
#
# Amaç: katalogdaki bütün başlıkların 180 gün içinde en az bir kez tanıtılması,
# akışı kitap önerisiyle boğmadan.
#
# Denge: her 30 günde ~10 kitap günü (gönderilerin üçte biri). Kalan günler
# bilgilendirici içerik. Kitap günleri 3 günde bir geliyor.
#
# 1-60. günler üretildi; 14 başlık tanıtıldı.
# 61-180 arası 40 kitap günü var: 38 tek kitap + 2 koleksiyon karuseli.
#
# "konu" alanı o günün içeriğinin ekseni — kitap konunun içinden çıkar,
# konu kitabın etrafına kurulmaz.

# Plan dışı tutulanlar: kataloğa kayıtlı ama bu 180 günde tanıtılmıyor.
# Denetim bunları eksik saymaz.
haric:
  kartelalar: "Kartelalar için ayrı bir çalışma yapılacak."

tamamlanan:
  araliq: "1-60"
  basliklar: [mecmuatus-sarf, mecmuatun-nahiv, suruhul-maksud, suruhul-izzi,
              emsile-bina-semasi, tuhfetus-seniyye, molla-cami, ed-durusun-nahviyye,
              et-tatbikus-sarfi, aciklamali-cekimler, suruhul-izhar, kavaidul-irab,
              telhisul-miftah, sarf-nahiv-set]

plan:

  # ═══ 3. AY (61-90) — Nahivde derinleşme, sarfın tamamlanması ═══
  - day: 61
    book: avamilan
    konu: "Âmil nedir? Harekeyi kim değiştirir?"
  - day: 64
    book: suruhul-bina
    konu: "Binâ'yı şerhle okumak: 35 bâbın arkasındaki kaide"
  - day: 67
    book: metin-kavaidul-irab
    konu: "Metin mi şerh mi? Ezber için sade metnin yeri"
  - day: 70
    book: katrun-neda
    konu: "Müellif kendi metnini şerh ederse"
  - day: 73
    book: es-sami-cami
    konu: "Molla Câmî'deki beyitler nereden geliyor?"
  - day: 76
    book: zuruf-ve-terkib
    konu: "Zarflar: cümlenin zamanı ve yeri"
  - day: 79
    book: rabtus-sevarid
    konu: "Şâhid beyit nedir, niçin ezberlenir?"
  - day: 82
    book: tuhfe-tercume
    konu: "Arapçası yetmeyen talebe ne yapmalı?"
  - day: 85
    book: ucaletur-rahmiyye
    konu: "Vaz' ilmi: lafız manaya nasıl bağlanır?"
  - day: 88
    koleksiyon: [avamil-semasi, sarf-seti, sarf-nahiv-karton-set, izzi-teftazani]
    konu: "Ezberi kolaylaştıran yardımcılar: şemalar ve takımlar"

  # ═══ 4. AY (91-120) — Belâgatın tamamlanması, fıkha giriş ═══
